<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
    background: white;
    font-family: Arial, sans-serif;
    margin: 0;
}
        .glass {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
    </style>
</head>
<body>
    <!--header-->
   <header class="glass shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <h1 class="text-3xl font-bold text-gray-900">
            Library Management System
        </h1>

        <div class="flex items-center gap-3">

            <input
                id="search"
                type="text"
                placeholder="Search books..."
                onkeyup="searchBook()"
                class="px-4 py-2 w-64 rounded-full border border-gray-300">

            <select
                id="categorySearch"
                onchange="searchBook()"
                class="px-4 py-2 rounded-full border border-gray-300">

                <option value="">All Categories</option>
                <option value="Programming">Programming</option>
                <option value="Web Development">Web Development</option>

            </select>

            <button
                onclick="openAdminLogin()"
                class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full">
                Admin
            </button>

            <button
                onclick="logoutAdmin()"
                class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-full">
                Logout
            </button>

            <span
                id="adminStatus"
                class="hidden text-green-600 font-semibold">
                Admin Mode Active
            </span>

        </div>

    </div>
</header>
    <div class="text-center py-10">
    <h1 class="text-5xl font-bold text-gray-900">Welcome to the Library</h1>
    <p class="text-gray-600 mt-3 text-lg">Manage books quickly and efficiently</p>
</div>
    <div class="max-w-7xl mx-auto p-6">
        
        <!--Dashboard-->
        <div class="grid md:grid-cols-3 gap-6 mb-8">
            <div class="glass rounded-xl shadow p-6 text-center">
               <h2 class="text-xl font-semibold text-gray-900">Total Books</h2>
               <p id="totalBooks" class="text-5xl text-gray-900 mt-3">0</p>
            </div>
            <div class="glass rounded-xl shadow p-6 text-center">
               <h2 class="text-xl font-semibold text-gray-900">Available</h2>
               <p id="availableBooks" class="text-5xl text-gray-900 mt-3">0</p>
            </div>
            <div class="glass rounded-xl shadow p-6 text-center">
                <h2 class="text-xl font-semibold text-gray-900">Issued</h2>
               <p id="issuedBooks" class="text-5xl text-gray-900 mt-3">0</p>
            </div>
        </div>

        <!--Add Books-->
        <div class="glass rounded-xl shadow p-6 mb-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-4"></h2>Add New Book</h2>

    <div class="grid md:grid-cols-5 gap-4">

        <input id="title"
            class="border border-gray-300 text-black bg-white p-3 rounded-xl"
            placeholder="Title">

        <input id="author"
            class="border border-gray-300 text-black bg-white p-3 rounded-xl"
            placeholder="Author">

        <input id="category"
            class="border border-gray-300 text-black bg-white p-3 rounded-xl"
            placeholder="Category">

        <select id="status"
            class="bg-white/20 border border-white/30 text-black p-3 rounded-xl">
            <option>Available</option>
            <option>Issued</option>
        </select>

       <button
    id="addBtn"
    onclick="addBook()"
    disabled
    class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl opacity-50 cursor-not-allowed">
    Add Book
</button>

    </div>
</div>

         <!--admin login-->
        <div id="adminModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center">
    <div class="glass p-6 rounded-xl w-80 text-gray-900">

        <h2 class="text-xl font-bold mb-4">Admin Login</h2>

        <input
            id="adminPass"
            type="password"
            placeholder="Enter password"
            class="w-full p-3 rounded-lg border border-gray-300 mb-4 text-black"
        >

        <button
            onclick="checkAdmin()"
            class="bg-green-600 hover:bg-green-700 text-white w-full py-2 rounded-lg">
            Login
        </button>

        <button
            onclick="closeAdminLogin()"
            class="mt-3 w-full text-gray-600">
            Cancel
        </button>

    </div>
</div>
</div>
      
        <!--Table-->
    
<table class="w-full text-left">

<thead class="bg-blue-900/40 text-white">
<tr>
    <th class="p-3">Book</th>
    <th class="p-3">Author</th>
    <th class="p-3">Category</th>
    <th class="p-3">Status</th>
    <th class="p-3">Action</th>
</tr>
</thead>

<tbody id="bookTable"></tbody>

</table>
    </div>
    <script>
        let books = [
    {
        title: "Java Programming",
        author: "James Gosling",
        category: "Programming",
        status: "Available"
    },
    {
        title: "HTML & CSS",
        author: "Jon Duckett",
        category: "Web Development",
        status: "Issued"
    },
    {
        title: "JavaScript",
        author: "Brendan Eich",
        category: "Programming",
        status: "Available"
    }
];
       function displayBooks(data) {
       
        updateCategoryFilter();
    let table = document.getElementById("bookTable");
    table.innerHTML = "";

    data.forEach((book, index) => {

        table.innerHTML += `
        <tr class="border-b border-gray-200 text-gray-900 hover:bg-gray-100">

            <td class="p-3">${book.title}</td>

            <td>${book.author}</td>

            <td>${book.category}</td>

            <td>
                <span class="px-3 py-1 rounded-full text-white ${
                    book.status === "Available"
                    ? "bg-emerald-500"
                    : "bg-rose-500"
                }">
                    ${book.status}
                </span>
            </td>

            <td class="space-x-2">

    ${
        isAdmin
        ? `
        <button
            onclick="toggleStatus(${index})"
            class="${
                book.status === "Available"
                ? "bg-yellow-500 hover:bg-yellow-600"
                : "bg-green-600 hover:bg-green-700"
            } text-white px-3 py-2 rounded-lg">

            ${
                book.status === "Available"
                ? "Issue"
                : "Return"
            }

        </button>

        <button
            onclick="deleteBook(${index})"
            class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg">
            Delete
        </button>
        `
        : `<span class="text-gray-400">Admin only</span>`
    }

</td>

        </tr>
        `;
    });

    updateDashboard();
}
           
    let isAdmin = false;
const ADMIN_PASSWORD = "admin123";

// Open modal
function openAdminLogin() {
    document.getElementById("adminModal").classList.remove("hidden");
}

// Close modal
function closeAdminLogin() {
    document.getElementById("adminModal").classList.add("hidden");
    document.getElementById("adminPass").value = "";
}

// Login check
function checkAdmin() {

    const pass = document.getElementById("adminPass").value;

    if (pass === ADMIN_PASSWORD) {

        isAdmin = true;

        document.getElementById("adminStatus").classList.remove("hidden");

        document.getElementById("addBtn").disabled = false;
        document.getElementById("addBtn").classList.remove("opacity-50", "cursor-not-allowed");

        closeAdminLogin();

        displayBooks(books);

        alert("Admin Login Successful");

    } else {

        alert("Wrong Password");

        document.getElementById("adminPass").value = "";
        document.getElementById("adminPass").focus();

    }

}
function logoutAdmin() {
    isAdmin = false;

    document.getElementById("adminStatus").classList.add("hidden");

    displayBooks(books);

    alert("Logged out of admin mode");
    document.getElementById("addBtn").disabled = true;
document.getElementById("addBtn").classList.add("opacity-50", "cursor-not-allowed");
}
      function addBook() {

    if (!isAdmin) {
        alert("Admin access required!");
        return;
    }

    let title = document.getElementById("title").value.trim();
    let author = document.getElementById("author").value.trim();
    let category = document.getElementById("category").value.trim();
    let status = document.getElementById("status").value;

    if (title === "" || author === "" || category === "") {
        alert("Please fill all fields.");
        return;
    }

    books.push({
        title,
        author,
        category,
        status
    });

    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    document.getElementById("category").value = "";
    document.getElementById("status").value = "Available";

    displayBooks(books);
}
        function deleteBook(index) {
    if (!isAdmin) {
        alert("Admin access required!");
        return;
    }
    books.splice(index, 1);
    displayBooks(books);
}
function toggleStatus(index) {

    if (!isAdmin) {
        alert("Admin access required!");
        return;
    }

    if (books[index].status === "Available") {
        books[index].status = "Issued";
    } else {
        books[index].status = "Available";
    }

    displayBooks(books);
}
        function searchBook() {

    let search = document.getElementById("search").value.toLowerCase();

    let category = document.getElementById("categorySearch").value;

    let filtered = books.filter(book => {

        let textMatch =
            book.title.toLowerCase().includes(search) ||
            book.author.toLowerCase().includes(search) ||
            book.category.toLowerCase().includes(search);

        let categoryMatch =
            category === "" || book.category === category;

        return textMatch && categoryMatch;
    });

    displayBooks(filtered);
}
function updateCategoryFilter() {

    let select = document.getElementById("categorySearch");

    let current = select.value;

    let categories = [...new Set(books.map(book => book.category))];

    select.innerHTML = `<option value="">All Categories</option>`;

    categories.forEach(cat => {

        select.innerHTML += `<option value="${cat}">${cat}</option>`;

    });

    select.value = current;
}
        function updateDashboard(){
            document.getElementById("totalBooks").innerHTML=books.length;
            let available=books.filter(book=>book.status==="Available").length;
            let issued=books.filter(book=>book.status==="Issued").length;
            document.getElementById("availableBooks").innerHTML=available;
            document.getElementById("issuedBooks").innerHTML=issued;
        }
        displayBooks(books);
        
        document.getElementById("adminPass").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
        checkAdmin();
    }
    
});

    </script>
    
</body>
</html>
