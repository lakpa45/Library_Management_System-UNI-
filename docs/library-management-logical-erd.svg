<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter>
    <style>
      .card{fill:#f6fbff;stroke:#12386b;stroke-width:2;rx:9;filter:url(#shadow)}
      .head{fill:#082e61}.title{font:700 38px Arial;fill:#082e61}.h{font:700 19px Arial;fill:white}
      .f{font:15px Arial;fill:#17243a}.key{font:700 12px Arial;fill:white}.rel{fill:none;stroke:#087b7b;stroke-width:3}
      .rl{font:16px Arial;fill:#086b6b}.cardinality{font:700 17px Arial;fill:#075f61}.group{fill:none;stroke:#12386b;stroke-width:2;stroke-dasharray:8 7;rx:14}
      .note{font:14px Arial;fill:#21334d}.legend{font:15px Arial;fill:#17243a}
    </style>
  </defs>
  <rect width="1536" height="1024" fill="#fffdfa"/>
  <text x="768" y="58" text-anchor="middle" class="title">Library Management System — Logical ERD</text>

  <!-- Core relationship lines, routed without crossings -->
  <path class="rel" d="M270 174 H420"/><text class="cardinality" x="278" y="163">||</text><text class="cardinality" x="397" y="163">o{</text><text class="rl" x="335" y="160">classifies</text>
  <path class="rel" d="M650 174 H815"/><text class="cardinality" x="658" y="163">||</text><text class="cardinality" x="790" y="163">o{</text><text class="rl" x="704" y="160">contains</text>
  <path class="rel" d="M270 542 H435"/><text class="cardinality" x="278" y="531">||</text><text class="cardinality" x="410" y="531">o{</text><text class="rl" x="335" y="528">makes</text>
  <path class="rel" d="M830 536 H1005 V330 H925"/><text class="cardinality" x="838" y="525">o{</text><text class="cardinality" x="934" y="319">||</text><text class="rl" x="920" y="520">appears in</text>
  <path class="rel" d="M270 790 H435"/><text class="cardinality" x="278" y="779">||</text><text class="cardinality" x="410" y="779">o{</text><text class="rl" x="330" y="776">creates</text>
  <path class="rel" d="M540 342 V392 H690 V742"/><text class="cardinality" x="550" y="365">||</text><text class="cardinality" x="699" y="730">o{</text><text class="rl" x="585" y="384">is saved in</text>

  <!-- CATEGORY -->
  <rect class="card" x="55" y="100" width="215" height="190"/><path class="head" d="M55 109Q55 100 64 100H261Q270 100 270 109V140H55Z"/><text class="h" x="162" y="127" text-anchor="middle">CATEGORY</text>
  <rect x="68" y="153" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="82" y="168" text-anchor="middle">PK</text><text class="f" x="105" y="169">category_id</text>
  <text class="f" x="72" y="199">category_name</text><text class="f" x="72" y="225">description</text><text class="f" x="72" y="251">color</text>

  <!-- BOOK -->
  <rect class="card" x="420" y="100" width="230" height="242"/><path class="head" d="M420 109Q420 100 429 100H641Q650 100 650 109V140H420Z"/><text class="h" x="535" y="127" text-anchor="middle">BOOK</text>
  <rect x="433" y="153" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="447" y="168" text-anchor="middle">PK</text><text class="f" x="470" y="169">book_id</text>
  <text class="f" x="437" y="196">title</text><text class="f" x="437" y="219">isbn</text><text class="f" x="437" y="242">description</text><text class="f" x="437" y="265">cover_image</text><text class="f" x="437" y="288">pdf_file</text><text class="f" x="437" y="311">book_type</text>
  <rect x="538" y="315" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="552" y="330" text-anchor="middle">FK</text><text class="f" x="574" y="330">category_id</text>

  <!-- BOOK COPY -->
  <rect class="card" x="815" y="100" width="220" height="230"/><path class="head" d="M815 109Q815 100 824 100H1026Q1035 100 1035 109V140H815Z"/><text class="h" x="925" y="127" text-anchor="middle">BOOK_COPY</text>
  <rect x="828" y="153" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="842" y="168" text-anchor="middle">PK</text><text class="f" x="865" y="169">copy_id</text>
  <text class="f" x="832" y="205">barcode</text><text class="f" x="832" y="235">status</text><rect x="828" y="260" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="842" y="275" text-anchor="middle">FK</text><text class="f" x="865" y="276">book_id</text>

  <!-- MEMBER -->
  <rect class="card" x="55" y="390" width="215" height="500"/><path class="head" d="M55 399Q55 390 64 390H261Q270 390 270 399V430H55Z"/><text class="h" x="162" y="417" text-anchor="middle">MEMBER</text>
  <rect x="68" y="443" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="82" y="458" text-anchor="middle">PK</text><text class="f" x="105" y="459">member_id</text>
  <text class="f" x="72" y="488">first_name</text><text class="f" x="72" y="515">last_name</text><text class="f" x="72" y="542">email</text><text class="f" x="72" y="569">password</text><text class="f" x="72" y="596">phone</text><text class="f" x="72" y="623">member_type</text><text class="f" x="72" y="650">department</text><text class="f" x="72" y="677">roll_id</text><text class="f" x="72" y="704">dob</text><text class="f" x="72" y="731">address</text><text class="f" x="72" y="758">valid_till</text><text class="f" x="72" y="785">card_no</text><text class="f" x="72" y="812">registered_on</text><text class="f" x="72" y="839">status</text>

  <!-- ISSUE -->
  <rect class="card" x="435" y="440" width="395" height="215"/><path class="head" d="M435 449Q435 440 444 440H821Q830 440 830 449V480H435Z"/><text class="h" x="632" y="467" text-anchor="middle">ISSUE</text>
  <rect x="450" y="493" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="464" y="508" text-anchor="middle">PK</text><text class="f" x="487" y="509">issue_id</text>
  <text class="f" x="450" y="540">issue_date</text><text class="f" x="450" y="570">due_date</text><text class="f" x="450" y="600">return_date</text><rect x="630" y="525" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="644" y="540" text-anchor="middle">FK</text><text class="f" x="667" y="541">member_id</text><rect x="630" y="565" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="644" y="580" text-anchor="middle">FK</text><text class="f" x="667" y="581">copy_id</text>

  <!-- WISHLIST -->
  <rect class="card" x="435" y="710" width="395" height="205"/><path class="head" d="M435 719Q435 710 444 710H821Q830 710 830 719V750H435Z"/><text class="h" x="632" y="737" text-anchor="middle">WISHLIST</text>
  <rect x="450" y="763" width="28" height="21" rx="4" fill="#f4aa00"/><text class="key" x="464" y="778" text-anchor="middle">PK</text><text class="f" x="487" y="779">wishlist_id</text>
  <rect x="450" y="793" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="464" y="808" text-anchor="middle">FK</text><text class="f" x="487" y="809">member_id</text><rect x="450" y="823" width="28" height="21" rx="4" fill="#7650c7"/><text class="key" x="464" y="838" text-anchor="middle">FK</text><text class="f" x="487" y="839">book_id</text><text class="f" x="650" y="809">created_at</text><rect x="620" y="853" width="28" height="21" rx="4" fill="#087b7b"/><text class="key" x="634" y="868" text-anchor="middle">AK</text><text class="f" x="657" y="869">(member_id, book_id)</text>

  <!-- Staff and security -->
  <rect class="group" x="1110" y="92" width="365" height="790"/><text class="h" x="1292" y="126" text-anchor="middle" style="fill:#082e61">Staff &amp; Security</text>
  <rect class="card" x="1150" y="150" width="285" height="190"/><rect class="head" x="1150" y="150" width="285" height="40"/><text class="h" x="1292" y="177" text-anchor="middle">LIBRARIAN</text><text class="f" x="1172" y="220">PK  librarian_id</text><text class="f" x="1172" y="248">name</text><text class="f" x="1172" y="276">email</text><text class="f" x="1172" y="304">password · phone</text>
  <rect class="card" x="1150" y="375" width="285" height="145"/><rect class="head" x="1150" y="375" width="285" height="40"/><text class="h" x="1292" y="402" text-anchor="middle">ADMIN</text><text class="f" x="1172" y="445">PK  admin_id</text><text class="f" x="1172" y="475">email</text><text class="f" x="1172" y="505">password</text>
  <rect class="card" x="1150" y="555" width="285" height="195"/><rect class="head" x="1150" y="555" width="285" height="40"/><text class="h" x="1292" y="582" text-anchor="middle">PASSWORD_RESET</text><text class="f" x="1172" y="625">PK  reset_id</text><text class="f" x="1172" y="655">email</text><text class="f" x="1172" y="685">token</text><text class="f" x="1172" y="715">expires_at · used</text>
  <text class="note" x="1292" y="795" text-anchor="middle">Member lookup by email is application logic,</text><text class="note" x="1292" y="817" text-anchor="middle">not a declared foreign key.</text>

  <rect x="50" y="940" width="985" height="55" rx="8" fill="#f5f8fb" stroke="#9ca8b7"/><text class="legend" x="70" y="974"><tspan font-weight="700">Legend:</tspan> PK = Primary Key   ·   FK = Foreign Key   ·   AK = Alternate/Unique Key   ·   || = exactly one   ·   o{ = zero or many</text>
</svg>
