<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Library Management System Gantt Chart</title>
  <desc id="desc">A twelve-week project schedule covering planning, foundation, core features, dashboards, quality assurance, and release.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".14"/>
    </filter>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#64748b}
      .head{font:700 14px Arial,sans-serif;fill:#334155}.week{font:700 13px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .group{font:700 14px Arial,sans-serif;fill:white;letter-spacing:.4px}.task{font:14px Arial,sans-serif;fill:#1e293b}
      .bartext{font:700 12px Arial,sans-serif;fill:white}.small{font:12px Arial,sans-serif;fill:#64748b}
      .grid{stroke:#dbe3ef;stroke-width:1}.row{fill:#f8fafc}.bar{rx:7;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f1f5f9"/>
  <rect x="35" y="28" width="1530" height="918" rx="18" fill="white" filter="url(#shadow)"/>
  <text id="chart-title" x="70" y="78" class="title">Library Management System</text>
  <text x="70" y="107" class="sub">12-Week Development Gantt Chart · September–November 2026</text>

  <!-- Table headings -->
  <rect x="70" y="135" width="300" height="48" rx="8" fill="#e2e8f0"/>
  <text x="90" y="165" class="head">WORKSTREAM / TASK</text>
  <rect x="380" y="135" width="1140" height="48" rx="8" fill="#e2e8f0"/>
  <g class="week">
    <text x="427.5" y="165">W1</text><text x="522.5" y="165">W2</text><text x="617.5" y="165">W3</text>
    <text x="712.5" y="165">W4</text><text x="807.5" y="165">W5</text><text x="902.5" y="165">W6</text>
    <text x="997.5" y="165">W7</text><text x="1092.5" y="165">W8</text><text x="1187.5" y="165">W9</text>
    <text x="1282.5" y="165">W10</text><text x="1377.5" y="165">W11</text><text x="1472.5" y="165">W12</text>
  </g>

  <!-- Alternating rows -->
  <g>
    <rect class="row" x="70" y="221" width="1450" height="36"/><rect class="row" x="70" y="293" width="1450" height="36"/>
    <rect class="row" x="70" y="407" width="1450" height="36"/><rect class="row" x="70" y="479" width="1450" height="36"/>
    <rect class="row" x="70" y="551" width="1450" height="36"/><rect class="row" x="70" y="665" width="1450" height="36"/>
    <rect class="row" x="70" y="737" width="1450" height="36"/><rect class="row" x="70" y="851" width="1450" height="36"/>
  </g>

  <!-- Vertical week grid -->
  <g class="grid">
    <line x1="380" y1="183" x2="380" y2="887"/><line x1="475" y1="183" x2="475" y2="887"/>
    <line x1="570" y1="183" x2="570" y2="887"/><line x1="665" y1="183" x2="665" y2="887"/>
    <line x1="760" y1="183" x2="760" y2="887"/><line x1="855" y1="183" x2="855" y2="887"/>
    <line x1="950" y1="183" x2="950" y2="887"/><line x1="1045" y1="183" x2="1045" y2="887"/>
    <line x1="1140" y1="183" x2="1140" y2="887"/><line x1="1235" y1="183" x2="1235" y2="887"/>
    <line x1="1330" y1="183" x2="1330" y2="887"/><line x1="1425" y1="183" x2="1425" y2="887"/>
    <line x1="1520" y1="183" x2="1520" y2="887"/>
  </g>

  <!-- Section: Planning -->
  <rect x="70" y="188" width="300" height="33" rx="6" fill="#4338ca"/><text x="88" y="210" class="group">PLANNING &amp; DESIGN</text>
  <text x="90" y="245" class="task">Requirements &amp; use cases</text>
  <text x="90" y="281" class="task">Architecture, database &amp; UI design</text>
  <rect class="bar" x="390" y="228" width="170" height="22" fill="#6366f1"/><text x="402" y="244" class="bartext">W1–W2</text>
  <rect class="bar" x="440" y="264" width="215" height="22" fill="#6366f1"/><text x="452" y="280" class="bartext">W1–W3</text>

  <!-- Section: Foundation -->
  <rect x="70" y="300" width="300" height="33" rx="6" fill="#0369a1"/><text x="88" y="322" class="group">SYSTEM FOUNDATION</text>
  <text x="90" y="357" class="task">Express, PostgreSQL &amp; migrations</text>
  <text x="90" y="393" class="task">Authentication, roles &amp; shared UI</text>
  <rect class="bar" x="485" y="340" width="255" height="22" fill="#0284c7"/><text x="497" y="356" class="bartext">W2–W4</text>
  <rect class="bar" x="580" y="376" width="255" height="22" fill="#0284c7"/><text x="592" y="392" class="bartext">W3–W5</text>

  <!-- Section: Core -->
  <rect x="70" y="414" width="300" height="33" rx="6" fill="#047857"/><text x="88" y="436" class="group">CORE FEATURES</text>
  <text x="90" y="471" class="task">Books, categories &amp; search</text>
  <text x="90" y="507" class="task">Members, borrowing &amp; returns</text>
  <text x="90" y="543" class="task">Due dates, fines &amp; wishlist</text>
  <text x="90" y="579" class="task">PDF upload &amp; digital books</text>
  <rect class="bar" x="675" y="454" width="255" height="22" fill="#059669"/><text x="687" y="470" class="bartext">W4–W6</text>
  <rect class="bar" x="770" y="490" width="350" height="22" fill="#059669"/><text x="782" y="506" class="bartext">W5–W8</text>
  <rect class="bar" x="865" y="526" width="255" height="22" fill="#059669"/><text x="877" y="542" class="bartext">W6–W8</text>
  <rect class="bar" x="865" y="562" width="255" height="22" fill="#059669"/><text x="877" y="578" class="bartext">W6–W8</text>

  <!-- Section: Dashboards -->
  <rect x="70" y="600" width="300" height="33" rx="6" fill="#b45309"/><text x="88" y="622" class="group">DASHBOARDS</text>
  <text x="90" y="657" class="task">Student dashboard</text>
  <text x="90" y="693" class="task">Librarian dashboard</text>
  <text x="90" y="729" class="task">Administrator dashboard</text>
  <rect class="bar" x="960" y="640" width="160" height="22" fill="#d97706"/><text x="972" y="656" class="bartext">W7–W8</text>
  <rect class="bar" x="1055" y="676" width="160" height="22" fill="#d97706"/><text x="1067" y="692" class="bartext">W8–W9</text>
  <rect class="bar" x="1055" y="712" width="160" height="22" fill="#d97706"/><text x="1067" y="728" class="bartext">W8–W9</text>

  <!-- Section: Quality -->
  <rect x="70" y="750" width="300" height="33" rx="6" fill="#be123c"/><text x="88" y="772" class="group">QUALITY &amp; RELEASE</text>
  <text x="90" y="807" class="task">Integration, security &amp; accessibility</text>
  <text x="90" y="843" class="task">User acceptance testing</text>
  <text x="90" y="879" class="task">Bug fixes, documentation &amp; release</text>
  <rect class="bar" x="1149" y="790" width="255" height="22" fill="#e11d48"/><text x="1161" y="806" class="bartext">W9–W11</text>
  <rect class="bar" x="1244" y="826" width="160" height="22" fill="#e11d48"/><text x="1256" y="842" class="bartext">W10–W11</text>
  <rect class="bar" x="1339" y="862" width="171" height="22" fill="#e11d48"/><text x="1351" y="878" class="bartext">W11–W12</text>

  <!-- Milestone markers -->
  <g fill="#0f172a">
    <path d="M665 192 l9 9 -9 9 -9-9z"/><path d="M1140 414 l9 9 -9 9 -9-9z"/><path d="M1510 862 l9 9 -9 9 -9-9z"/>
  </g>
  <text x="680" y="205" class="small">Design approved</text>
  <text x="1155" y="427" class="small">Core complete</text>
  <text x="1398" y="915" class="small">◆ Production release</text>
</svg>
