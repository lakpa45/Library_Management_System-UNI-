<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
     <style>
          body {
    background: white;
    font-family: Arial, sans-serif;
    margin: 0;
}
        .glass {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
    </style>
</head>
<body>
   <!--Header-->
   <header class="glass shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-900"> Student Dashboard</h1>
        <div class="flex items-center gap-3">
            <input 
            id="search"
            type="text"
            placeholder="Search Books..."
            class="px-4 py-2 w-64 rounded-full border border-gray-300"
            onkeyup="searchBook()">
            <button
    onclick="logout()"
    class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-full">
    Logout
</button>
        </div>
    </div>
   </header>
   <!--Welcome-->
   <div class="text-center py-10">
    <h1 class="text-5xl font-bold text-gray-900">Welcome, Students</h1>
    <p class="text-gray-600 mt-3 text-lg">Manage your books, renew them, check fines and update your profile.</p>
</div>
 <!-- Dashboard Cards -->
<div class="max-w-7xl mx-auto px-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">

        <div class="glass rounded-xl shadow p-6 text-center">
            <h3 class="text-xl font-semibold text-gray-900">Borrowed Books</h3>
            <p id="borrowedCount" class="text-5xl text-gray-900 mt-3">0</p>
        </div>

        <div class="glass rounded-xl shadow p-6 text-center">
            <h3 class="text-xl font-semibold text-gray-900">Due Soon</h3>
            <p id="dueCount" class="text-5xl text-gray-900 mt-3">0</p>
        </div>

        <div class="glass rounded-xl shadow p-6 text-center">
            <h3 class="text-xl font-semibold text-gray-900">Returned</h3>
            <p id="returnedCount" class="text-5xl text-gray-900 mt-3">0</p>
        </div>

        <div class="glass rounded-xl shadow p-6 text-center">
            <h3 class="text-xl font-semibold text-gray-900">Fine</h3>
            <p id="fineCount" class="text-5xl text-gray-900 mt-3">₹0</p>
        </div>

    </div>
</div>
<!--Borrowed Books-->
<div class="max-w-7xl mx-auto mt-10">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-2xl font-bold mb-5">Borrowed Books</h2>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-white text-gray-600">
                    <tr>
                        <th class="p-3 text-left">Books</th>
                        <th class="p-3 text-left">Author</th>
                        <th class="p-3 text-left">Due Date</th>
                        <th class="p-3 text-left">Status</th>
                        <th class="p-3 text-left">Action</th>
                    </tr>
                </thead>
                <tbody id="bookTable"></tbody>
            </table>
        </div>
    </div>
</div>
<!-- Profile -->
 <div class="max-w-7xl mx-auto mt-10 mb-10">
    <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-2xl font-bold mb-6">Update Profile</h2>
        <div class="grid md:grid-cols-2 gap-5">
            <input
            id="name"
            class="border p-3 rounded-lg"
            placeholder="Student Name">
            <input
            id="email"
            class="border p-3 rounded-lg"
            placeholder="Email">
            <input
            id="phone"
            class="border p-3 rounded-lg"
            placeholder="Phone">
            <input
            id="department"
            class="border p-3 rounded-lg"
            placeholder="Department">
        </div>
        <button 
        onclick="updateProfile()"
        class="mt-6 bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-lg">Save Profile</button>
    </div>
 </div>
<script>
    let books=[
        {
            title:"Java Programming",
            author:"James Gosling",
            due:"15 July 2026",
            status:"Borrowed",
            fine:0
        },
        {
            title:"HTML & CSS",
            author:"Jon Duckett",
            due:"20 July 2026",
            status:"Borrowed",
            fine:20
        },
        {
            title:"JavaScript",
            author:"Brendan Eich",
            due:"28 July 2026",
            status:"Returned",
            fine:0
        }
    ];
   function displayBooks(data) {
    let table = document.getElementById("bookTable");
    table.innerHTML = "";

    data.forEach((book, index) => {
        table.innerHTML += `
        <tr class="border-b hover:bg-gray-100">
            <td class="p-3">${book.title}</td>
            <td>${book.author}</td>
            <td>${book.due}</td>
            <td>
                <span class="px-3 py-1 rounded-full text-white ${
                    book.status == "Borrowed"
                        ? "bg-orange-500"
                        : "bg-green-600"
                }">
                    ${book.status}
                </span>
            </td>
            <td>
                ${
                    book.status == "Borrowed"
                    ? `
                    <button
                        onclick="renewBook(${index})"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        Renew
                    </button>
                    `
                    : "-"
                }
            </td>
        </tr>
        `;
    });

    updateDashboard();
}
function updateDashboard(){
    let borrowed=books.filter(b=>b.status=="Borrowed").length;
    let returned=books.filter(b=>b.status=="Returned").length;
    let fine=books.reduce((sum,b)=>sum+b.fine,0);
    document.getElementById("borrowedCount").innerHTML=borrowed;
    document.getElementById("returnedCount").innerHTML=returned;
    document.getElementById("dueCount").innerHTML=borrowed;
    document.getElementById("fineTotal").innerHTML="₹"+fine;
    }
    function searchBook(){
        let value=document.getElementById("search").value.toLowerCase();
        let filtered=books.filter(book=>
            book.title.toLowerCase().include(value) || book.author.toLowerCase().includes(value)
        );
        displayBooks(filtered);
    }
    function renewBook(index){
        if(books[index].status=="Borrowed"){
            alert("Book renewed successfully!\nNew due date will be assiged by the librarian.");
        }
    }
    function updateProfile(){
        alert("Profile Updated Successfully!");
    }
    function logout() {
    window.location.href = "library.html";
}
    displayBooks(books);
</script>
</body>
</html>
