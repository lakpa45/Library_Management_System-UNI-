<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue & Return Books</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

<div class="max-w-7xl mx-auto p-8">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-slate-800">📚 Issue & Return Books</h1>
            <p class="text-gray-500">Manage book issue and return records.</p>
        </div>

       
    </div>

    <!-- Cards -->
    <div class="grid lg:grid-cols-2 gap-8">

        <!-- Issue Book -->
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <h2 class="text-2xl font-semibold text-green-600 mb-6">
                📖 Issue Book
            </h2>

            <form class="space-y-5">

                <div>
                    <label class="font-medium">Student Enrollment Number</label>
                    <input type="text"
                    placeholder="Enter Enrollment Number"
                    class="w-full mt-2 border rounded-xl p-3 focus:ring-2 focus:ring-green-500">
                </div>

                <div>
                    <label class="font-medium">Book ISBN</label>
                    <input type="text"
                    placeholder="Enter ISBN"
                    class="w-full mt-2 border rounded-xl p-3">
                </div>

                <div>
                    <label class="font-medium">Book Name</label>
                    <input type="text"
                    placeholder="Book Name"
                    class="w-full mt-2 border rounded-xl p-3">
                </div>

                <div class="grid grid-cols-2 gap-4">

                    <div>
                        <label>Issue Date</label>
                        <input type="date"
                        class="w-full mt-2 border rounded-xl p-3">
                    </div>

                    <div>
                        <label>Due Date</label>
                        <input type="date"
                        class="w-full mt-2 border rounded-xl p-3">
                    </div>

                </div>

                <button
                class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-semibold transition">
                    Issue Book
                </button>

            </form>

        </div>

        <!-- Return Book -->
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <h2 class="text-2xl font-semibold text-red-600 mb-6">
                🔄 Return Book
            </h2>

            <form class="space-y-5">

                <div>
                    <label class="font-medium">Student Enrollment Number</label>
                    <input type="text"
                    placeholder="Enter Enrollment Number"
                    class="w-full mt-2 border rounded-xl p-3">
                </div>

                <div>
                    <label class="font-medium">Book ISBN</label>
                    <input type="text"
                    placeholder="Enter ISBN"
                    class="w-full mt-2 border rounded-xl p-3">
                </div>

                <div>
                    <label>Return Date</label>
                    <input type="date"
                    class="w-full mt-2 border rounded-xl p-3">
                </div>

                <button
                class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-semibold transition">
                    Return Book
                </button>

            </form>

        </div>

    </div>

    <!-- Recent Transactions -->
    <div class="bg-white rounded-2xl shadow-lg mt-10 p-8">

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold">📋 Recent Transactions</h2>

            <input type="text"
            id="searchInput"
            placeholder="Search..."
            class="border rounded-lg px-4 py-2 w-64">
        </div>

        <div class="overflow-x-auto">

            <table class="w-full text-left">

                <thead class="bg-slate-100">

                <tr>
                    <th class="p-4">Enrollment No.</th>
                    <th class="p-4">Student</th>
                    <th class="p-4">Book</th>
                    <th class="p-4">Issue Date</th>
                    <th class="p-4">Status</th>
                </tr>

                </thead>

                <tbody>

                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-4">BCA24001</td>
                        <td class="p-4">Dawa Doma</td>
                        <td class="p-4">Database Management</td>
                        <td class="p-4">25-07-2026</td>
                        <td class="p-4">
                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
                                Issued
                            </span>
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-4">BCA24005</td>
                        <td class="p-4">Sonam</td>
                        <td class="p-4">Java Programming</td>
                        <td class="p-4">24-07-2026</td>
                        <td class="p-4">
                            <span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm">
                                Returned
                            </span>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
<script>
const searchInput = document.getElementById("searchInput");
const tableRows = document.querySelectorAll("#transactionTable tr");

searchInput.addEventListener("keyup", function () {

    const searchValue = this.value.toLowerCase();

    tableRows.forEach(row => {

        const rowText = row.textContent.toLowerCase();

        if (rowText.includes(searchValue)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });

});
</script>
</html>
