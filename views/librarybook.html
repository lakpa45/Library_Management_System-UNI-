<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICFAI College Library — Catalog</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --ink:      #1F4A3D;
    --ink-dark: #163731;
    --walnut:   #5C4630;
    --parchment:#FBF7EC;
    --paper-line:#E7DFCB;
    --charcoal: #2B2620;
    --brass:    #B8903C;
    --oxblood:  #8B3230;
  }
  body{ font-family:'Inter', sans-serif; background:var(--parchment); color:var(--charcoal); }
  .font-display{ font-family:'Newsreader', serif; }
  .font-mono{ font-family:'JetBrains Mono', monospace; }
  .wood-grain{
    background-color: var(--walnut);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.08) 0px, rgba(0,0,0,0.08) 1px, transparent 1px, transparent 7px),
      linear-gradient(180deg, #6b543a, #503d29);
  }
  .paper-texture{
  background-image: none;
}
  .tab-btn{
    position: relative;
    top: 8px;
    clip-path: polygon(8% 0, 92% 0, 100% 100%, 0% 100%);
  }
  .tab-btn.active{ top: 0; }
  .book-card{ transition: transform .18s ease, box-shadow .18s ease; }
  .book-card:hover{ transform: translateY(-4px); box-shadow: 0 14px 24px -12px rgba(22,55,49,0.35); }
  .spine{
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 2px, transparent 2px, transparent 5px);
  }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#c9bd9f; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    .book-card{ transition:none; }
  }
</style>
</head>
<body class="paper-texture min-h-screen text-[#1B2A22]">
<!-- Drawer-front header -->
<header class="bg-[#1e3a5f] text-[#F3EADA] border-b-4 border-[#A9834F]">
  <div class="max-w-6xl mx-auto px-6 pt-6 pb-0">
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div>
        <p class="font-mono text-[11px] tracking-[0.4em] text-white uppercase">ICFAI College</p>
        <h1 class="font-display text-3xl sm:text-4xl mt-1 text-white">Library Catalog</h1>
      </div>
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-72">
          <input
            id="search-input" type="text" placeholder="Search title or author…"
            class="w-full bg-white text-[--charcoal] placeholder-[#8a7c5f] text-sm rounded-full px-4 py-2.5 outline-none focus:ring-2 focus:ring-[--brass]">
          <svg class="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-[#8a7c5f]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
          </svg>
        </div>
      </div>
    </div>
    <!-- Category tabs (drawer labels) -->
    <nav id="category-tabs" class="flex gap-1.5 mt-6 overflow-x-auto pb-0 -mb-px">
      <!-- populated by JS -->
    </nav>
  </div>
</header>
<main class="max-w-6xl mx-auto px-6 py-9 paper-texture">
  <div class="flex items-center justify-between mb-6">
    <p id="result-count" class="font-mono text-xs text-[#6b6152] uppercase tracking-widest"></p>
    <div class="flex items-center gap-2 text-xs font-mono text-[#6b6152]">
      <label for="status-filter" class="uppercase tracking-widest">Show</label>
      <select id="status-filter" class="bg-transparent border border-[--paper-line] rounded-sm px-2 py-1 outline-none focus:border-[--ink]">
        <option value="all">All copies</option>
        <option value="available">Available only</option>
        <option value="checked-out">Checked out only</option>
      </select>
    </div>
  </div>
  <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <p id="empty-state" class="hidden text-center py-20 font-display text-xl text-[#8a7c5f]">No books match the drawer you're looking in — try another search.</p>
</main>
<footer class="border-t border-[--paper-line] mt-10">
  <p class="max-w-6xl mx-auto px-6 py-6 font-mono text-[11px] text-[#8a7c5f] tracking-wide">
    ICFAI College Library · circulation desk open Mon–Fri 8:00–20:00
  </p>
</footer>
<!-- Detail modal -->
<div id="modal-backdrop" class="fixed inset-0 bg-[#1a1610]/60 backdrop-blur-[2px] hidden items-center justify-center p-6 z-50">
  <div id="modal-card" class="bg-[--parchment] max-w-lg w-full rounded-sm shadow-2xl overflow-hidden">
    <div id="modal-spine" class="h-2 spine"></div>
    <div class="p-7">
      <div class="flex items-start justify-between gap-4">
        <div>
          <p id="modal-category" class="font-mono text-[11px] uppercase tracking-[0.25em] text-[--ink]"></p>
          <h2 id="modal-title" class="font-display text-2xl mt-1 leading-snug"></h2>
          <p id="modal-author" class="text-sm text-[#6b6152] mt-1"></p>
        </div>
        <button id="modal-close" aria-label="Close" class="text-[#8a7c5f] hover:text-[--charcoal] text-2xl leading-none">&times;</button>
      </div>
      <p id="modal-desc" class="text-sm text-[--charcoal] mt-4 leading-relaxed"></p>
      <div class="flex items-center justify-between mt-6 pt-5 border-t border-[--paper-line]">
        <div>
          <p class="font-mono text-[11px] text-[#8a7c5f] uppercase tracking-widest">Call number</p>
          <p id="modal-call" class="font-mono text-sm mt-0.5"></p>
        </div>
        <div id="modal-status" class="stamp px-3 py-1 font-mono text-[11px] uppercase font-bold rounded-sm"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const books = [
    { title: "Introduction to Algorithms", author: "Cormen, Leiserson, Rivest & Stein", category: "Computer Science", call: "QA76.6 .I585", available: true, copies: 3, desc: "The standard reference on algorithm design and analysis, covering sorting, graph algorithms, and complexity theory." },
    { title: "Structure and Interpretation of Computer Programs", author: "Abelson & Sussman", category: "Computer Science", call: "QA76.6 .A255", available: false, copies: 0, desc: "A foundational text on programming using Scheme, focused on abstraction and computational processes." },
    { title: "Design Patterns", author: "Gamma, Helm, Johnson & Vlissides", category: "Computer Science", call: "QA76.64 .D47", available: true, copies: 2, desc: "Catalog of reusable object-oriented design solutions, known as the 'Gang of Four' book." },

    { title: "Pride and Prejudice", author: "Jane Austen", category: "Literature", call: "PR4034 .P7", available: true, copies: 5, desc: "A witty social comedy following Elizabeth Bennet's navigation of manners, marriage, and morality." },
    { title: "One Hundred Years of Solitude", author: "Gabriel García Márquez", category: "Literature", call: "PQ8180.17 .A73", available: false, copies: 0, desc: "The multigenerational saga of the Buendía family in the mythical town of Macondo." },
    { title: "Beloved", author: "Toni Morrison", category: "Literature", call: "PS3563.O8749 B4", available: true, copies: 2, desc: "A haunting exploration of memory, trauma, and freedom in the aftermath of slavery." },

    { title: "Linear Algebra Done Right", author: "Sheldon Axler", category: "Mathematics", call: "QA184.2 .A94", available: true, copies: 4, desc: "A proof-based introduction to linear algebra that avoids determinants until necessary." },
    { title: "Calculus", author: "Michael Spivak", category: "Mathematics", call: "QA303.2 .S65", available: true, copies: 1, desc: "A rigorous single-variable calculus text emphasizing proof and mathematical maturity." },
    { title: "Introduction to Probability", author: "Blitzstein & Hwang", category: "Mathematics", call: "QA273 .B58", available: false, copies: 0, desc: "A story-driven approach to probability theory grounded in intuition and real examples." },

    { title: "The Feynman Lectures on Physics", author: "Richard Feynman", category: "Physics", call: "QC23 .F47", available: true, copies: 3, desc: "Feynman's celebrated undergraduate lecture series spanning mechanics, electromagnetism, and quantum theory." },
    { title: "Cosmos", author: "Carl Sagan", category: "Physics", call: "QB44.2 .S24", available: true, copies: 2, desc: "A sweeping tour of astronomy, science history, and humanity's place in the universe." },
    { title: "Six Easy Pieces", author: "Richard Feynman", category: "Physics", call: "QC23 .F473", available: false, copies: 0, desc: "An accessible entry point into Feynman's physics lectures for the non-specialist." },

    { title: "A People's History of the United States", author: "Howard Zinn", category: "History", call: "E178.1 .Z75", available: true, copies: 3, desc: "American history retold from the perspective of workers, women, and marginalized groups." },
    { title: "Guns, Germs, and Steel", author: "Jared Diamond", category: "History", call: "CB151 .D48", available: true, copies: 2, desc: "An examination of why societies developed and expanded at different rates across history." },
    { title: "The Silk Roads", author: "Peter Frankopan", category: "History", call: "DS33.1 .F73", available: false, copies: 0, desc: "A history of the world told through the trade routes connecting East and West." },

    { title: "Thinking, Fast and Slow", author: "Daniel Kahneman", category: "Business", call: "BF441 .K34", available: true, copies: 4, desc: "An exploration of the two systems that drive human judgment and decision-making." },
    { title: "The Innovator's Dilemma", author: "Clayton Christensen", category: "Business", call: "HD53 .C48", available: true, copies: 1, desc: "How disruptive technologies can cause successful companies to fail — and how to respond." },
    { title: "Principles", author: "Ray Dalio", category: "Business", call: "HG172.D35 A3", available: false, copies: 0, desc: "A framework for decision-making and organizational culture drawn from Dalio's career." },
  ];
  const categoryColors = {
    "Computer Science": "#1F4A3D",
    "Literature":        "#8B3230",
    "Mathematics":        "#3A4E7A",
    "Physics":           "#6B4A9E",
    "History":           "#946227",
    "Business":          "#2F6B63",
  };
  let activeCategory = "All";
  let searchTerm = "";
  let statusFilterVal = "all";
  const categories = ["All", ...Array.from(new Set(books.map(b => b.category)))];
  const tabsEl = document.getElementById("category-tabs");
  function renderTabs() {
    tabsEl.innerHTML = categories.map(cat => `
      <button
        data-cat="${cat}"
        class="tab-btn ${cat === activeCategory ? 'active bg-[--parchment] text-[--charcoal]' : 'bg-[#4a3a27] text-[#D8C6A0] hover:bg-[#573f27]'}
               font-mono text-xs uppercase tracking-wider px-4 py-2.5 whitespace-nowrap rounded-t-sm"
      >${cat}</button>
    `).join("");
  }
  tabsEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-cat]");
    if (!btn) return;
    activeCategory = btn.dataset.cat;
    renderTabs();
    renderGrid();
  });
  const gridEl = document.getElementById("book-grid");
  const emptyEl = document.getElementById("empty-state");
  const countEl = document.getElementById("result-count");
  function getFiltered() {
    return books.filter(b => {
      const matchesCat = activeCategory === "All" || b.category === activeCategory;
      const matchesSearch = !searchTerm ||
        b.title.toLowerCase().includes(searchTerm) ||
        b.author.toLowerCase().includes(searchTerm);
      const matchesStatus =
        statusFilterVal === "all" ||
        (statusFilterVal === "available" && b.available) ||
        (statusFilterVal === "checked-out" && !b.available);
      return matchesCat && matchesSearch && matchesStatus;
    });
  }
  function renderGrid() {
    const filtered = getFiltered();
    countEl.textContent = `${filtered.length} title${filtered.length !== 1 ? "s" : ""} · ${activeCategory}`;
    gridEl.classList.toggle("hidden", filtered.length === 0);
    emptyEl.classList.toggle("hidden", filtered.length !== 0);
    gridEl.innerHTML = filtered.map((b, i) => {
      const color = categoryColors[b.category] || "#1F4A3D";
      return `
      <button
        data-idx="${books.indexOf(b)}"
        class="book-card text-left bg-[#FFFDF7] rounded-sm overflow-hidden shadow-sm border border-[--paper-line] focus:outline-none focus:ring-2 focus:ring-[--brass]"
      >
        <div class="h-2.5 spine" style="background-color:${color}"></div>
        <div class="p-5">
          <div class="flex items-start justify-between gap-3">
  <p class="font-mono text-[10px] uppercase tracking-[0.2em]" style="color:${color}">
    ${b.category}
  </p>
</div>
          <h3 class="font-display text-lg mt-2 leading-snug">${b.title}</h3>
          <p class="text-sm text-[#6b6152] mt-1">${b.author}</p>
          <p class="font-mono text-[11px] text-[#9a8f76] mt-4">${b.call}</p>
        </div>
      </button>
    `; }).join("");
  }
  const backdrop = document.getElementById("modal-backdrop");
  const modalSpine = document.getElementById("modal-spine");
  const modalCategory = document.getElementById("modal-category");
  const modalTitle = document.getElementById("modal-title");
  const modalAuthor = document.getElementById("modal-author");
  const modalDesc = document.getElementById("modal-desc");
  const modalCall = document.getElementById("modal-call");
  const modalStatus = document.getElementById("modal-status");
  function openModal(book) {
    const color = categoryColors[book.category] || "#1F4A3D";
    modalSpine.style.backgroundColor = color;
    modalCategory.textContent = book.category;
    modalCategory.style.color = color;
    modalTitle.textContent = book.title;
    modalAuthor.textContent = book.author;
    modalDesc.textContent = book.desc;
    modalCall.textContent = book.call;
    modalStatus.textContent = book.available ? `Available · ${book.copies} cop${book.copies === 1 ? 'y' : 'ies'}` : "Checked Out";
    modalStatus.style.color = book.available ? "#1F4A3D" : "#8B3230";
    backdrop.classList.remove("hidden");
    backdrop.classList.add("flex");
  }
  function closeModal() {
    backdrop.classList.add("hidden");
    backdrop.classList.remove("flex");
  }
  gridEl.addEventListener("click", (e) => {
    const card = e.target.closest("button[data-idx]");
    if (!card) return;
    openModal(books[Number(card.dataset.idx)]);
  });
  document.getElementById("modal-close").addEventListener("click", closeModal);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
  document.getElementById("search-input").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase();
    renderGrid();
  });
  document.getElementById("status-filter").addEventListener("change", (e) => {
    statusFilterVal = e.target.value;
    renderGrid();
  });
  renderTabs();
  renderGrid();
</script>
</body>
</html>
