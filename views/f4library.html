<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Book</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">
<h1 class="text-3xl font-bold mb-6">Issue Book</h1>
<div class="space-y-4">
<div>
<label class="font-semibold">Member Name</label>
<select id="member" class="w-full border rounded-lg p-3 mt-1"></select>
</div>
<div>
<label class="font-semibold">Book</label>
<select id="book" class="w-full border rounded-lg p-3 mt-1"></select>
</div>
<button onclick="issueBook()"
class="bg-emerald-600 text-white px-6 py-3 rounded-lg hover:bg-emerald-700">
Issue Book
</button>
</div>
<h2 class="text-2xl font-bold mt-10 mb-4">Issued Books</h2>
<table class="w-full border">
<thead class="bg-gray-200">
<tr>
<th class="p-3">Member</th>
<th class="p-3">Book</th>
<th class="p-3">Date</th>
</tr>
</thead>
<tbody id="issuedTable"></tbody>
</table>
</div>
<script>
let libraryData=JSON.parse(localStorage.getItem("libraryData"))||{
books:[],
members:[],
issuedBooks:0,
overdue:0,
issuedList:[]
};
libraryData.issuedList=libraryData.issuedList||[];
function save(){
localStorage.setItem("libraryData",JSON.stringify(libraryData));
}
function loadData(){
const member=document.getElementById("member");
const book=document.getElementById("book");
member.innerHTML="";
book.innerHTML="";
libraryData.members.forEach(m=>{
member.innerHTML+=`<option>${m.name}</option>`;
});
libraryData.books.forEach(b=>{
book.innerHTML+=`<option>${b.title}</option>`;
});
showIssued();
}
function issueBook(){
if(libraryData.members.length==0){
alert("No members registered.");
return;
}
if(libraryData.books.length==0){
alert("No books available.");
return;
}
const member=document.getElementById("member").value;
const book=document.getElementById("book").value;
libraryData.issuedList.push({
member,
book,
date:new Date().toLocaleDateString()
});
libraryData.issuedBooks++;
const b=libraryData.books.find(x=>x.title==book);
if(b){
b.issued=(b.issued||0)+1;
}
save();
showIssued();
alert("Book Issued Successfully");
}
function showIssued(){
const table=document.getElementById("issuedTable");
table.innerHTML="";
libraryData.issuedList.forEach(item=>{
table.innerHTML+=`
<tr class="border-b">
<td class="p-3">${item.member}</td>
<td class="p-3">${item.book}</td>
<td class="p-3">${item.date}</td>
</tr>
`;
});
}
loadData();
</script>
</body>
</html>
