<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Management - Register</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-amber-100 to-stone-200 flex items-center justify-center min-h-screen"
  >
    <!--AUTH SCREEN -->
    <div
      id="authScreen"
      class="min-h-screen flex items-center justify-center px-4"
    >
      <div
        class="w-full max-w-5xl grid md:grid-cols-2 rounded-2xl overflow-hidden shadow-2xl bg-white"
      >
        <!-- Left panel -->
        <div
          class="bg-emerald-700 text-white p-10 flex flex-col justify-between relative overflow-hidden"
        >
          <div
            class="absolute -right-10 -bottom-10 w-56 h-56 rounded-full border border-brass/20"
          ></div>
          <div
            class="absolute -right-4 -bottom-24 w-56 h-56 rounded-full border border-brass/10"
          ></div>
          <div>
            <div class="flex items-center gap-2 mb-8">
              <span class="font-display text-2xl tracking-tight"
                >Library Management System</span
              >
            </div>
            <h1 class="font-display text-3xl leading-snug mb-3">
              A quiet room<br />for your books.
            </h1>
            <p class="text-paper/70 text-sm leading-relaxed max-w-xs">
              Catalogue, borrow, and return titles — with fines tracked
              automatically and every shelf a search away.
            </p>
          </div>
          <p class="text-xs text-paper/50 relative z-10">
            Est. for readers who return things on time.
          </p>
        </div>

        
        <!-- Right panel-->
        <div
          class="bg-[#fbf8f1] p-8 rounded-xl shadow-lg w-full max-w-md min-h-[500px]"
        >
          <div class="flex border-b border-forest/10 mb-6 text-sm font-medium">
            <button
              id="tabLogin"
              onclick="switchAuthTab('login')"
              class="pb-3 px-1 mr-6 border-b-2 tab-active"
            >
              Sign in
            </button>
            <button
              id="tabRegister"
              onclick="switchAuthTab('register')"
              class="pb-3 px-1 border-b-2 border-transparent text-ink/50"
            >
              Register
            </button>
          </div>

          <!-- Login form -->
          <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div>
              <label class="text-xs font-medium text-ink/60">Email</label>
              <input
                required
                type="email"
                id="loginEmail"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
                placeholder="you@example.com"
              />
            </div>
            <div>
              <label class="text-xs font-medium text-ink/60">Password</label>
              <input
                required
                type="password"
                id="loginPassword"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
                placeholder="••••••••"
              />
            </div>
            <p id="loginError" class="hidden text-sm text-red-600"></p>
            <button
              type="submit"
              class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg py-2.5 font-medium transition"
            >
              Sign In
            </button>
          </form>

          <!-- Register form -->
          <form
            id="registerForm"
            class="space-y-4 hidden"
            onsubmit="handleRegister(event)"
          >
            <div>
              <label class="text-xs font-medium text-ink/60">First Name</label>
              <input
                required
                type="text"
                id="regFirstName"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-ink/60">Last Name</label>
              <input
                required
                type="text"
                id="regLastName"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-ink/60"
                >Phone Number</label
              >
              <input
                required
                type="tel"
                id="regPhone"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Enter 10-digit phone number"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-ink/60">Email</label>
              <input
                required
                type="email"
                id="regEmail"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-ink/60">Password</label>
              <input
                required
                type="password"
                minlength="4"
                id="regPassword"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-ink/60"
                >Confirm Password</label
              >
              <input
                required
                type="password"
                minlength="4"
                id="regConfirmPassword"
                class="mt-1 w-full rounded-lg border border-forest/15 bg-white px-3 py-2 text-sm"
              />
            </div>

            <p id="registerError" class="text-xs text-red-600 hidden"></p>

            <button
              type="submit"
              class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg py-2.5 font-medium transition"
            >
              Create Account
            </button>
          </form>
          <p id="message" class="text-center mt-5 font-semibold"></p>
        </div>
      </div>
    </div>
    <script src="../public/js/register_member.js"></script>
  </body>
</html>
