<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Library Management System</title>
    <link rel="stylesheet" href="/output.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg m-8">

        <h2 class="text-3xl font-bold text-center text-black-600">
            Create Your Account
        </h2>

        <p class="text-center text-gray-500 mt-2 mb-6">
            Join our learning community today!
        </p>

        <form id="signupForm" class="space-y-4">

            <!-- First Name -->
            <div>
        <label class="block mb-1 font-medium">First Name</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-5 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/person_icon.svg" alt="person icon" class="w-5 h-5">
            </div>
            <input id="first_name" type="text" placeholder="Enter your first name"
                class="w-full border pl-11 pr-4 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black-600"
                required>
        </div>
    </div>

    <!-- Last Name -->
    <div>
        <label class="block mb-1 font-medium">Last Name</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-5 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/person_icon.svg" alt="person icon" class="w-5 h-5">
            </div>
            <input id="last_name" type="text" placeholder="Enter your last name"
                class="w-full border pl-11 pr-4 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black-600"
                required>
        </div>
    </div>

    <!-- Email -->
    <div>
        <label class="block mb-1 font-medium">Email</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-5 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/email.svg" alt="email icon" class="w-5 h-5">
            </div>
            <input id="email" type="email" placeholder="name@example.com"
                class="w-full pl-11 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
    </div>

    <!-- Phone Number -->
    <div>
        <label class="block mb-1 font-medium">Phone Mobile</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-5 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/phone_icon.svg" alt="phone icon" class="w-5 h-5">
            </div>
            <input id="phone" type="text" placeholder="(+91) 95644-74890"
                class="w-full border pl-11 pr-4 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black-600"
                required>
        </div>
    </div>

    <!-- Password -->
    <div>
        <label class="block mb-1 font-medium">Password</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-4 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/pasword_icon.svg" alt="password icon" class="w-5 h-5">
            </div>
            <input id="password" type="password" placeholder="At least 8 characters"
                class="w-full pl-11 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
        <p id="passwordStrengthMsg" class="text-sm mt-1"></p>
    </div>

    <!-- Confirm Password -->
    <div>
        <label class="block mb-1 font-medium">Confirm Password</label>
        <div class="relative">
            <div class="absolute inset-y-0 left-0 top-4 flex items-center pl-3.5 pointer-events-none">
                <img src="/images/pasword_icon.svg" alt="password icon" class="w-5 h-5">
            </div>
            <input id="confirm_password" type="password" placeholder="Confirm your password"
                class="w-full pl-11 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                required>
        </div>
        <p id="passwordMatchMsg" class="text-sm mt-1"></p>
    </div>
    <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
        Register
    </button>

    </form>

    <p class="text-center text-sm mt-6">
        Already have an account?
            <a href="login.html" class="text-blue-600 hover:underline">
                Login
            </a>
    </p>

    </div>
<script src="/js/signup.js"></script>
</body>
</html>
