<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Members</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
    font-family:Arial,Helvetica,sans-serif;
}
</style>
</head>
<body class="bg-gray-100">
<div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-emerald-700 text-white">
        <div class="p-6 text-2xl font-bold border-b border-emerald-600">
            Library Admin
        </div>
        <nav class="mt-6">
            <a href="f2library.html" class="block px-6 py-3 hover:bg-emerald-600">Dashboard</a>
            <a href="books.html" class="block px-6 py-3 hover:bg-emerald-600">Books</a>
            <a href="members.html" class="block px-6 py-3 bg-emerald-800">Members</a>
            <a href="f4library.html" class="block px-6 py-3 hover:bg-emerald-600">Issue Books</a>
            <a href="#" class="block px-6 py-3 hover:bg-emerald-600">Reports</a>
        </nav>
    </aside>
    <!-- Main -->
    <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Members Management</h1>
            <button
            onclick="addMember()"
            class="bg-emerald-600 text-white px-5 py-2 rounded-lg hover:bg-emerald-700">Add Member</button>
        </div>
        <!-- Search -->
        <div class="bg-white p-5 rounded-xl shadow mb-6">
            <div class="flex gap-4">
                <input
                id="search"
                type="text"
                placeholder="Search Member..."
                class="border rounded-lg p-3 flex-1">
                <button
                onclick="searchMember()"
                class="bg-blue-600 text-white px-5 rounded-lg">Search</button>
            </div>
        </div>
        <!-- Members Table -->
        <div class="bg-white rounded-xl shadow">
            <table class="w-full">
                <thead class="bg-gray-200">
                <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">Name</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Phone</th>
                    <th class="p-3">Action</th>
                </tr>
                </thead>
                <tbody id="memberTable">
                </tbody>
            </table>
        </div>
    </main>
</div>
<script>
if(localStorage.getItem("loggedIn")!="true"){
    window.location.href="flibrary.html";
}
let libraryData=JSON.parse(localStorage.getItem("libraryData")) || {
    books:[],
    members:[],
    issuedBooks:0,
    overdue:0
};
function saveData(){
    localStorage.setItem("libraryData",JSON.stringify(libraryData));
}
function loadMembers(){
    const table=document.getElementById("memberTable");
    table.innerHTML="";
    if(libraryData.members.length==0){
        table.innerHTML=`
        <tr>
        <td colspan="5" class="text-center p-5 text-gray-500">
        No Members Found
        </td>
        </tr>`;
        return;
    }
    libraryData.members.forEach((member,index)=>{
        table.innerHTML+=`
        <tr class="border-b text-center">
        <td class="p-3">${index+1}</td>
        <td class="p-3">${member.name}</td>
        <td class="p-3">${member.email}</td>
        <td class="p-3">${member.phone}</td>
        <td class="p-3">
        <button
        onclick="deleteMember(${index})"
        class="bg-red-500 text-white px-3 py-1 rounded">
        Delete
        </button>
        </td>
        </tr>
        `;
    });
}
function addMember(){
    let name=prompt("Enter Member Name");
    if(!name) return;
    let email=prompt("Enter Email");
    if(!email) return;
    let phone=prompt("Enter Phone Number");
    if(!phone) return;
    libraryData.members.push({
        name,
        email,
        phone
    });
    saveData();
    loadMembers();
    alert("Member Added Successfully");
}
function deleteMember(index){
    if(confirm("Delete this member?")){
        libraryData.members.splice(index,1);
        saveData();
        loadMembers();
    }
}
function searchMember(){
    const keyword=document.getElementById("search").value.toLowerCase();
    const rows=document.querySelectorAll("#memberTable tr");
    rows.forEach(row=>{
        if(row.innerText.toLowerCase().includes(keyword))
            row.style.display="";
        else
            row.style.display="none";
    });
}
loadMembers();
</script>
</body>
</html>
