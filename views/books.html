<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
    <link href="/css/output.css" rel="stylesheet">
    <style>
      body {
        font-family: "Source Sans 3", sans-serif;
        background-color: #f5efe6;
      }
      .font-display {
        font-family: Georgia, "Times New Roman", serif;
      }
      .paper-texture {
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(27, 67, 50, 0.05) 1px,
          transparent 0
        );
        background-size: 22px 22px;
      }
      .card-hover {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 24px -8px rgba(27, 67, 50, 0.25);
      }
      .brass-underline {
        position: relative;
      }
      .brass-underline::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        height: 3px;
        width: 48px;
        background: #c9972f;
        border-radius: 2px;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #c9972f;
        border-radius: 8px;
      }
      .modal-enter {
        animation: modalIn 0.18s ease-out;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .book-cover {
        width: 100%;
        height: 160px;
        object-fit: cover;
        background: #e4d9c4;
      }
    </style>
  </head>
  <body class="paper-texture min-h-screen text-[#1B2A22]">
    <!-- Header -->
    <header class="bg-[#1e3a5f] text-[#F3EADA] border-b-4 border-[#A9834F]">
      <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div>
            <h1 class="font-display text-2xl text-white font-semibold">Library</h1>
            <p class="text-xs text-[#C9D9CF] tracking-wide uppercase">Books</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          
            <a href="/admin_bk_category.html"
            class="inline-flex items-center gap-2 text-[#F3EADA] hover:text-white text-sm font-medium transition"
          >
            ← Back to Categories
          </a>
          <button
            id="openAddBtn"
            type="button"
            class="hidden sm:inline-flex items-center gap-2 bg-[#C9972F] hover:bg-[#B6862A] text-[#1B2A22] font-semibold px-4 py-2.5 rounded-md transition"
          >
            <span class="text-lg leading-none">+</span>
            Add Book
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-10">
      <!-- Intro + Stats -->
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6 mb-8">
        <div>
          <h2 class="font-display text-3xl font-semibold brass-underline pb-2 text-[#1B4332]">
            Browse the Catalog
          </h2>
          <p class="text-[#4A5A50] mt-4 max-w-xl">
            Add books to the library, assign them a category, and give each one a cover
            and description.
          </p>
        </div>
        <div class="flex gap-4">
          <div class="bg-white border border-[#E4D9C4] rounded-lg px-5 py-3 text-center shadow-sm">
            <p id="statBookCount" class="text-2xl font-semibold text-[#1B4332]">0</p>
            <p class="text-xs uppercase tracking-wide text-[#8A7B5C]">Total Books</p>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="flex gap-3 mb-8">
        <div class="relative flex-1">
          <svg
            class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[#8A7B5C]"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z"
            />
          </svg>
          <input
            id="searchInput"
            type="text"
            placeholder="Search books..."
            class="w-full pl-10 pr-4 py-2.5 rounded-md border border-[#E4D9C4] bg-white focus:outline-none focus:ring-2 focus:ring-[#C9972F] text-sm"
          />
        </div>
        <button
          id="openAddBtnMobile"
          type="button"
          class="sm:hidden inline-flex items-center justify-center bg-[#C9972F] hover:bg-[#B6862A] text-[#1B2A22] font-semibold px-4 rounded-md transition"
        >
          +
        </button>
      </div>

      <!-- Book Grid -->
      <div id="bookGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-20">
        <p class="font-display text-xl text-[#4A5A50] mb-2">No books yet</p>
        <p class="text-sm text-[#8A7B5C] mb-5">Add your first book to get started.</p>
        <button
          id="emptyAddBtn"
          type="button"
          class="inline-flex items-center gap-2 bg-[#1B4332] hover:bg-[#163A29] text-[#F5EFE6] font-semibold px-5 py-2.5 rounded-md transition"
        >
          Add a book
        </button>
      </div>
    </main>

    <!-- Add / Edit Modal -->
    <div
      id="bookModal"
      class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 flex items-center justify-center px-4"
    >
      <div class="modal-enter bg-[#F5EFE6] border border-[#E4D9C4] rounded-xl shadow-2xl w-full max-w-md overflow-hidden max-h-[90vh] overflow-y-auto">
        <div class="bg-[#1B4332] px-6 py-4 flex items-center justify-between">
          <h3 id="modalTitle" class="font-display text-lg font-semibold text-[#F5EFE6]">
            New Book
          </h3>
          <button id="closeModalBtn" type="button" class="text-[#F5EFE6]/70 hover:text-white">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form id="bookForm" class="px-6 py-6 space-y-4">
          <input type="hidden" id="bookID" />

          <div>
            <label for="bookTitle" class="block text-xs font-semibold uppercase tracking-wide text-[#4A5A50] mb-1.5">
              Book Title
            </label>
            <input
              id="bookTitle"
              required
              type="text"
              placeholder="e.g. Discrete Mathematics"
              class="w-full px-3.5 py-2.5 rounded-md border border-[#E4D9C4] bg-white focus:outline-none focus:ring-2 focus:ring-[#C9972F] text-sm"
            />
          </div>

          <div>
            <label for="bookDesc" class="block text-xs font-semibold uppercase tracking-wide text-[#4A5A50] mb-1.5">
              Description
            </label>
            <textarea
              id="bookDesc"
              rows="3"
              placeholder="Short description of this book"
              class="w-full px-3.5 py-2.5 rounded-md border border-[#E4D9C4] bg-white focus:outline-none focus:ring-2 focus:ring-[#C9972F] text-sm resize-none"
            ></textarea>
          </div>

          <div>
            <label for="bookCover" class="block text-xs font-semibold uppercase tracking-wide text-[#4A5A50] mb-1.5">
              Cover Image
            </label>
            <input
              id="bookCover"
              type="file"
              accept="image/*"
              class="w-full text-sm text-[#4A5A50] file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:bg-[#C9972F] file:text-[#1B2A22] file:font-semibold file:text-sm hover:file:bg-[#B6862A]"
            />
            <img id="coverPreview" class="hidden mt-3 h-32 rounded-md border border-[#E4D9C4] object-cover" />
          </div>

          <div class="flex gap-3 pt-2">
            <button
              type="button"
              id="cancelModalBtn"
              class="flex-1 py-2.5 rounded-md border border-[#E4D9C4] text-[#4A5A50] font-semibold hover:bg-white transition text-sm"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="flex-1 py-2.5 rounded-md bg-[#C9972F] hover:bg-[#B6862A] text-[#1B2A22] font-semibold transition text-sm"
            >
              Save Book
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div
      id="deleteModal"
      class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 flex items-center justify-center px-4"
    >
      <div class="modal-enter bg-[#F5EFE6] border border-[#E4D9C4] rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
        <p class="font-display text-lg font-semibold text-[#1B4332] mb-2">Remove this book?</p>
        <p class="text-sm text-[#4A5A50] mb-6">This will permanently delete it from the catalog.</p>
        <div class="flex gap-3">
          <button id="cancelDeleteBtn" type="button" class="flex-1 py-2.5 rounded-md border border-[#E4D9C4] text-[#4A5A50] font-semibold hover:bg-white transition text-sm">
            Cancel
          </button>
          <button id="confirmDeleteBtn" type="button" class="flex-1 py-2.5 rounded-md bg-[#9E4A4A] hover:bg-[#873E3E] text-white font-semibold transition text-sm">
            Remove
          </button>
        </div>
      </div>
    </div>

    <script src="/js/admin_dashboard_guard.js"></script>
    <script src="/js/books.js"></script>
  </body>
</html>
