<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Audit Logs | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link href="/output.css" rel="stylesheet"><link href="/css/admin_dashboard_shared.css" rel="stylesheet">
</head>
<body>
    <script src="/js/admin_dashboard_guard.js"></script>
    <div class="dashboard-shell">
        <aside class="sidebar" id="sidebar"><div class="sidebar-brand"><span class="brand-grid" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span>APNA</span></div><p class="quick-label">Admin Console</p><div class="quick-icons"><a href="/admin/dashboard" title="Dashboard"><i class="fa-solid fa-chart-column"></i></a><a href="/admin/librarians" title="Librarians"><i class="fa-solid fa-user-tie"></i></a><a href="/admin/audit-logs" class="active" title="Audit Logs"><i class="fa-solid fa-clock-rotate-left"></i></a></div><nav class="side-nav" aria-label="Admin navigation"><a href="/admin/dashboard"><i class="fa-solid fa-chart-column"></i> Dashboard</a><a href="/admin/librarians"><i class="fa-solid fa-user-tie"></i> Librarians</a><a href="/admin/audit-logs" class="active" aria-current="page"><i class="fa-solid fa-clock-rotate-left"></i> Audit Logs</a><a href="#" data-admin-logout><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a></nav><div class="sidebar-footer">Secure Administration Portal<br>APNA Library · 2026</div></aside>
        <button type="button" class="sidebar-overlay" id="sidebarOverlay" aria-label="Close navigation"></button>
        <main class="main-area"><header class="top-header"><button type="button" class="mobile-menu" id="mobileMenuBtn" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button><div class="top-search"><input type="search" placeholder="Search audit logs" aria-label="Search audit logs"><button type="button" class="search-btn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button><div class="profile"><span class="profile-name">Administrator</span><span class="avatar">A</span></div></div><div class="welcome"><div class="welcome-title"><span class="home-icon"><i class="fa-solid fa-clock-rotate-left"></i></span><span>Audit Logs</span></div><span class="today">Admin workspace</span></div></header><div class="dashboard-content"><section class="report-card"><div class="panel"><div class="panel-head"><h1>System Activity</h1><span>Administrative events</span></div><div class="filter-bar"><input type="search" placeholder="Search actor or action" aria-label="Filter audit logs"><select aria-label="Filter audit action"><option>All actions</option><option>Created</option><option>Updated</option><option>Deleted</option><option>Signed in</option></select></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Status</th></tr></thead><tbody><tr><td colspan="5"><div class="empty-state"><i class="fa-solid fa-clock-rotate-left"></i><h2>No audit events available</h2><p>Recorded administrative activity will appear here.</p></div></td></tr></tbody></table></div></div></section></div></main>
    </div>
    <script src="/js/admin_shell.js"></script><script>document.querySelector('[data-admin-logout]').addEventListener('click',(event)=>{event.preventDefault();localStorage.removeItem('adminToken');window.location.href='/'});</script>

</html>
