<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link href="/css/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center bg-[#f1f1f0]">

    <div class="w-full max-w-md px-6">

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="mx-auto mb-4 w-16 h-16 bg-[#ffd45e] rounded-full 
                            flex items-center justify-center">
                    <span class="text-2xl text-white">🔐</span>
                </div>

                <h1 class="text-3xl font-bold text-gray-800">
                    Admin Login
                </h1>

                <p class="text-gray-500 mt-2">
                    Sign in to access the admin panel
                </p>
            </div>

            <!-- Login Form -->
            <form id="adminLoginForm">

                <!-- Email -->
                <div class="mb-5">
                    <label 
                        for="email"
                        class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@example.com"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-transparent">
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label 
                        for="password"
                        class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg
                               focus:outline-none focus:ring-2 focus:ring-blue-500
                               focus:border-transparent">
                </div>

                <!-- Remember / Forgot
                <div class="flex items-center justify-between mb-6">

                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input 
                            type="checkbox"
                            name="remember"
                            class="w-4 h-4">
                        Remember me
                    </label>

                    <a 
                        href="/admin/forgot-password"
                        class="text-sm text-blue-600 hover:text-blue-800">
                        Forgot password?
                    </a>

                </div> -->

                <p id="loginError" class="hidden text-sm text-red-600 mb-4"></p>
                <!-- Login Button -->
                 
                <button
                    type="submit"
                    class="w-full bg-[#ffd45e] text-white py-3 rounded-lg
                           font-semibold hover:bg-blue-700
                           transition duration-200">
                    Login
                </button>

            </form>

            <!-- Back to Website -->
            <div class="text-center mt-6">
                <a 
                    href="/"
                    class="text-sm text-gray-500 hover:text-blue-600">
                    ← Back to website
                </a>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-sm text-gray-500 mt-6">
            © 2026 Admin Panel. All rights reserved.
        </p>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/admin_login.js"></script>
</body>
</html>
